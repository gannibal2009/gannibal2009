<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gannibal Trading • Rock Recordings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: radial-gradient(ellipse at 50% 80%, #4a1500 0%, #1a0500 100%);
            position: relative;
            overflow: hidden;
        }

        .fire-icons {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }
        .fire-icon {
            position: absolute;
            font-size: 28px;
            opacity: 0.6;
            animation: floatFire 10s infinite ease-in-out alternate;
            filter: drop-shadow(0 0 20px rgba(255, 80, 30, 0.6));
            will-change: transform;
        }
        .fire-icon:nth-child(1) { left: 10px; top: 20%; animation-duration: 12s; animation-delay: 0s; }
        .fire-icon:nth-child(2) { left: 5px; top: 50%; animation-duration: 14s; animation-delay: 2s; font-size: 34px; }
        .fire-icon:nth-child(3) { left: 15px; top: 75%; animation-duration: 11s; animation-delay: 4s; }
        .fire-icon:nth-child(4) { right: 10px; top: 15%; animation-duration: 13s; animation-delay: 1s; }
        .fire-icon:nth-child(5) { right: 5px; top: 55%; animation-duration: 15s; animation-delay: 3s; font-size: 34px; }
        .fire-icon:nth-child(6) { right: 15px; top: 80%; animation-duration: 12s; animation-delay: 5s; }
        .fire-icon:nth-child(7) { left: 25%; top: 8px; animation-duration: 16s; animation-delay: 0.5s; }
        .fire-icon:nth-child(8) { left: 55%; top: 5px; animation-duration: 14s; animation-delay: 2.5s; }
        .fire-icon:nth-child(9) { right: 25%; top: 8px; animation-duration: 15s; animation-delay: 1.5s; }
        .fire-icon:nth-child(10) { left: 20%; bottom: 8px; animation-duration: 17s; animation-delay: 3.5s; }
        .fire-icon:nth-child(11) { left: 50%; bottom: 5px; animation-duration: 13s; animation-delay: 0.8s; }
        .fire-icon:nth-child(12) { right: 20%; bottom: 8px; animation-duration: 16s; animation-delay: 4.5s; }
        @keyframes floatFire {
            0% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 0.4; }
            25% { transform: translate(15px, -25px) rotate(10deg) scale(1.1); opacity: 0.8; }
            50% { transform: translate(-10px, -45px) rotate(-5deg) scale(0.9); opacity: 0.5; }
            75% { transform: translate(20px, -15px) rotate(8deg) scale(1.05); opacity: 0.9; }
            100% { transform: translate(-5px, -60px) rotate(-3deg) scale(0.95); opacity: 0.4; }
        }

        .card {
            position: relative;
            z-index: 2;
            max-width: 400px;
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            border-radius: 48px;
            padding: 40px 28px 30px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9), 0 0 0 2px rgba(255, 100, 50, 0.2);
            border: 1px solid rgba(255, 100, 50, 0.15);
            text-align: center;
            background-image: url('https://gannibal2009.github.io/Gitar-gannibal.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 580px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .avatar-placeholder { height: 90px; flex-shrink: 0; }

        .fire-text {
            font-size: 38px;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 6px;
            background: linear-gradient(180deg, #ffcc66 0%, #ff6633 30%, #cc2200 70%, #661100 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            -webkit-text-stroke: 1px rgba(255, 255, 255, 0.9);
            text-shadow: 0 0 40px rgba(255, 80, 30, 0.4), 0 0 80px rgba(255, 50, 0, 0.2);
            animation: fireGlow 2.5s infinite alternate ease-in-out;
        }
        @keyframes fireGlow {
            0% { text-shadow: 0 0 30px rgba(255, 80, 30, 0.3), 0 0 60px rgba(255, 50, 0, 0.1); }
            100% { text-shadow: 0 0 50px rgba(255, 80, 30, 0.6), 0 0 100px rgba(255, 50, 0, 0.3); }
        }
        .sub {
            font-family: 'Courier New', monospace;
            font-size: 18px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.6), 0 0 30px rgba(255, 200, 50, 0.4), 0 0 0 2px #ffcc00, 0 0 0 4px #b38800, 0 0 30px rgba(255, 200, 0, 0.3);
            margin-bottom: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin: 10px 0 20px;
            width: 100%;
        }
        .divider-line { flex: 1; height: 1px; background: linear-gradient(to right, transparent, rgba(255, 100, 50, 0.5), transparent); }
        .divider-icon { font-size: 18px; opacity: 0.7; color: #ff6633; filter: drop-shadow(0 0 10px rgba(255, 80, 30, 0.3)); }

        .email-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-bottom: 24px;
            cursor: pointer;
            position: relative;
            width: 100%;
        }
        .email {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            user-select: none;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(255, 200, 100, 0.2), 0 0 0 2px #ffaa00;
            -webkit-text-stroke: 1px rgba(255, 170, 0, 0.7);
            display: inline-block;
            padding-bottom: 4px;
            text-transform: uppercase;
            transition: 0.3s;
            text-align: center;
        }
        .email-wrapper:hover .email { color: #ffcc88; text-shadow: 0 0 30px rgba(255, 200, 100, 0.4), 0 0 0 2px #ffaa00; }

        .toast-email {
            font-size: 14px;
            font-weight: 600;
            color: #ffaa00;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            padding: 6px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255, 170, 0, 0.3);
            box-shadow: 0 0 30px rgba(255, 170, 0, 0.15);
            opacity: 0;
            transform: scale(0.8) translateY(-10px);
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none;
            white-space: nowrap;
            font-family: 'Inter', sans-serif;
        }
        .toast-email.show { opacity: 1; transform: scale(1) translateY(0); }

        .btn {
            display: inline-block;
            padding: 14px 32px;
            border-radius: 60px;
            text-decoration: none;
            font-family: 'Courier New', monospace;
            font-weight: 700;
            font-size: 18px;
            letter-spacing: 2px;
            color: #ff8844;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255, 100, 50, 0.25);
            transition: all 0.3s ease;
            text-shadow: 0 0 20px rgba(255, 80, 30, 0.2);
            box-shadow: inset 0 0 30px rgba(255, 80, 30, 0.05);
            text-transform: uppercase;
            margin-top: 8px;
            width: auto;
        }
        .btn:hover {
            background: rgba(255, 80, 30, 0.2);
            border-color: #ff6633;
            box-shadow: 0 0 40px rgba(255, 80, 30, 0.2), inset 0 0 40px rgba(255, 80, 30, 0.1);
            transform: scale(1.05);
            color: #ffaa66;
        }

        /* ===== СПЕЦІАЛЬНА КНОПКА ТЕЛЕГРАМ (КОЛІР ЯК EMAIL) ===== */
        .tg-btn {
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255, 200, 100, 0.2), 0 0 0 2px #ffaa00;
            -webkit-text-stroke: 1px rgba(255, 170, 0, 0.7);
            border-color: rgba(255, 170, 0, 0.3);
        }
        .tg-btn:hover {
            color: #ffcc88;
            background: rgba(255, 170, 0, 0.1);
            border-color: #ffaa00;
            box-shadow: 0 0 40px rgba(255, 170, 0, 0.2), inset 0 0 40px rgba(255, 170, 0, 0.1);
        }

        @media (max-width: 480px) {
            .card { padding: 30px 18px 22px; border-radius: 32px; min-height: 500px; }
            .fire-text { font-size: 30px; }
            .sub { font-size: 15px; }
            .email { font-size: 18px; }
            .btn { padding: 12px 24px; font-size: 16px; }
            .avatar-placeholder { height: 60px; }
            .fire-icon { font-size: 22px; }
            .fire-icon:nth-child(2) { font-size: 28px; }
            .fire-icon:nth-child(5) { font-size: 28px; }
            .toast-email { font-size: 12px; padding: 4px 12px; }
        }
    </style>
</head>
<body>
    <div class="fire-icons">
        <div class="fire-icon">🔥</div>
        <div class="fire-icon">🔥</div>
        <div class="fire-icon">🔥</div>
        <div class="fire-icon">🔥</div>
        <div class="fire-icon">🔥</div>
        <div class="fire-icon">🔥</div>
        <div class="fire-icon">🔥</div>
        <div class="fire-icon">🔥</div>
        <div class="fire-icon">🔥</div>
        <div class="fire-icon">🔥</div>
        <div class="fire-icon">🔥</div>
        <div class="fire-icon">🔥</div>
    </div>

    <div class="card">
        <div class="avatar-placeholder"></div>
        <div class="fire-text">Gannibal Trading</div>
        <div class="sub">Rock Fan · Record Collector</div>
        <div class="divider">
            <span class="divider-line"></span>
            <span class="divider-icon">✦</span>
            <span class="divider-line"></span>
        </div>
        <div class="email-wrapper" id="emailWrapper">
            <span class="email" id="email">Email</span>
            <span class="toast-email" id="toastEmail">📋 Copied!</span>
        </div>

        <a href="https://docs.google.com/spreadsheets/d/1b8wUNhlKo8arsSiXPvMlN1110AHAv5og/edit?usp=sharing" class="btn" target="_blank">View Catalog</a>
        <a href="https://t.me/Gannibal2009" class="btn tg-btn" target="_blank">My Telegram</a>
    </div>

    <script>
        document.getElementById('emailWrapper').addEventListener('click', function() {
            const email = 'rammsteinthebest2015@gmail.com';
            const toast = document.getElementById('toastEmail');
            navigator.clipboard.writeText(email).then(() => {
                toast.classList.add('show');
                setTimeout(() => { toast.classList.remove('show'); }, 2000);
            }).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = email;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                toast.classList.add('show');
                setTimeout(() => { toast.classList.remove('show'); }, 2000);
            });
        });
    </script>
</body>
</html>
