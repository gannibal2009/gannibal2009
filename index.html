<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gannibal Trading • Rock Recordings</title>
    
    <!-- ===== ФАВІКОНКА (ГІТАРА) ===== -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎸%3C/text%3E%3C/svg%3E">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎸%3C/text%3E%3C/svg%3E">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            font-family: 'Inter', sans-serif;
            background: radial-gradient(ellipse at 50% 80%, #4a1500 0%, #1a0500 100%);
            position: relative;
            overflow-y: auto;
        }
        body::-webkit-scrollbar {
            width: 0;
            background: transparent;
        }
        body {
            scrollbar-width: none;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .fire-icons {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }
        .fire-icon {
            position: absolute;
            font-size: 28px;
            opacity: 0.6;
            animation: floatFire 10s infinite ease-in-out alternate;
            filter: drop-shadow(0 0 20px rgba(255, 80, 30, 0.6));
            will-change: transform;
        }
        .fire-icon:nth-child(1) { left: 10px; top: 20%; animation-duration: 12s; animation-delay: 0s; }
        .fire-icon:nth-child(2) { left: 5px; top: 50%; animation-duration: 14s; animation-delay: 2s; font-size: 34px; }
        .fire-icon:nth-child(3) { left: 15px; top: 75%; animation-duration: 11s; animation-delay: 4s; }
        .fire-icon:nth-child(4) { right: 10px; top: 15%; animation-duration: 13s; animation-delay: 1s; }
        .fire-icon:nth-child(5) { right: 5px; top: 55%; animation-duration: 15s; animation-delay: 3s; font-size: 34px; }
        .fire-icon:nth-child(6) { right: 15px; top: 80%; animation-duration: 12s; animation-delay: 5s; }
        .fire-icon:nth-child(7) { left: 25%; top: 8px; animation-duration: 16s; animation-delay: 0.5s; }
        .fire-icon:nth-child(8) { left: 55%; top: 5px; animation-duration: 14s; animation-delay: 2.5s; }
        .fire-icon:nth-child(9) { right: 25%; top: 8px; animation-duration: 15s; animation-delay: 1.5s; }
        .fire-icon:nth-child(10) { left: 20%; bottom: 8px; animation-duration: 17s; animation-delay: 3.5s; }
        .fire-icon:nth-child(11) { left: 50%; bottom: 5px; animation-duration: 13s; animation-delay: 0.8s; }
        .fire-icon:nth-child(12) { right: 20%; bottom: 8px; animation-duration: 16s; animation-delay: 4.5s; }
        @keyframes floatFire {
            0% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 0.4; }
            25% { transform: translate(15px, -25px) rotate(10deg) scale(1.1); opacity: 0.8; }
            50% { transform: translate(-10px, -45px) rotate(-5deg) scale(0.9); opacity: 0.5; }
            75% { transform: translate(20px, -15px) rotate(8deg) scale(1.05); opacity: 0.9; }
            100% { transform: translate(-5px, -60px) rotate(-3deg) scale(0.95); opacity: 0.4; }
        }

        .card {
            position: relative;
            z-index: 2;
            max-width: 400px;
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            border-radius: 48px;
            padding: 30px 24px 24px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9), 0 0 0 2px rgba(255, 100, 50, 0.2);
            border: 1px solid rgba(255, 100, 50, 0.15);
            text-align: center;
            background-image: url('https://gannibal2009.github.io/Gitar-gannibal.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 85vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .avatar-placeholder { height: 40px; flex-shrink: 0; }

        .fire-text {
            font-size: 34px;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 4px;
            background: linear-gradient(180deg, #ffcc66 0%, #ff6633 30%, #cc2200 70%, #661100 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            -webkit-text-stroke: 1px rgba(255, 255, 255, 0.9);
            text-shadow: 0 0 40px rgba(255, 80, 30, 0.4), 0 0 80px rgba(255, 50, 0, 0.2);
            animation: fireGlow 2.5s infinite alternate ease-in-out;
        }
        @keyframes fireGlow {
            0% { text-shadow: 0 0 30px rgba(255, 80, 30, 0.3), 0 0 60px rgba(255, 50, 0, 0.1); }
            100% { text-shadow: 0 0 50px rgba(255, 80, 30, 0.6), 0 0 100px rgba(255, 50, 0, 0.3); }
        }

        .sub {
            font-family: 'Courier New', monospace;
            font-size: 16px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.6), 0 0 30px rgba(255, 200, 50, 0.4), 0 0 0 2px #ffcc00, 0 0 0 4px #b38800, 0 0 30px rgba(255, 200, 0, 0.3);
            margin-bottom: 8px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 6px 0 12px;
            width: 100%;
        }
        .divider-line { flex: 1; height: 1px; background: linear-gradient(to right, transparent, rgba(255, 100, 50, 0.5), transparent); }
        .divider-icon { font-size: 16px; opacity: 0.7; color: #ff6633; filter: drop-shadow(0 0 10px rgba(255, 80, 30, 0.3)); }

        .btn-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 100%;
            margin-top: 4px;
        }

        .btn {
            display: inline-block;
            padding: 12px 28px;
            border-radius: 60px;
            text-decoration: none;
            font-family: 'Courier New', monospace;
            font-weight: 700;
            font-size: 16px;
            letter-spacing: 1.5px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255, 100, 50, 0.25);
            transition: all 0.3s ease;
            text-shadow: 0 0 20px rgba(255, 80, 30, 0.2);
            box-shadow: inset 0 0 30px rgba(255, 80, 30, 0.05);
            text-transform: uppercase;
            width: auto;
            min-width: 150px;
            text-align: center;
            color: #ff8844;
        }
        .btn:hover {
            background: rgba(255, 80, 30, 0.2);
            border-color: #ff6633;
            box-shadow: 0 0 40px rgba(255, 80, 30, 0.2), inset 0 0 40px rgba(255, 80, 30, 0.1);
            transform: scale(1.05);
            color: #ffaa66;
        }

        .spacer { height: 6px; width: 100%; }

        .btn-tg {
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255, 200, 100, 0.2), 0 0 0 2px #ffaa00;
            -webkit-text-stroke: 1px rgba(255, 170, 0, 0.7);
            border-color: rgba(255, 170, 0, 0.3);
        }
        .btn-tg:hover {
            color: #ffcc88;
            background: rgba(255, 170, 0, 0.1);
            border-color: #ffaa00;
            box-shadow: 0 0 40px rgba(255, 170, 0, 0.2), inset 0 0 40px rgba(255, 170, 0, 0.1);
        }

        .email-wrapper {
            position: relative;
            display: inline-block;
        }

        .btn-email {
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255, 200, 100, 0.2), 0 0 0 2px #ffaa00;
            -webkit-text-stroke: 1px rgba(255, 170, 0, 0.7);
            border-color: rgba(255, 170, 0, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255, 170, 0, 0.3);
            padding: 12px 28px;
            border-radius: 60px;
            font-family: 'Courier New', monospace;
            font-weight: 700;
            font-size: 16px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            min-width: 150px;
            text-align: center;
        }
        .btn-email:hover {
            color: #ffcc88;
            background: rgba(255, 170, 0, 0.1);
            border-color: #ffaa00;
            box-shadow: 0 0 40px rgba(255, 170, 0, 0.2), inset 0 0 40px rgba(255, 170, 0, 0.1);
        }

        .copy-toast {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            font-size: 14px;
            font-weight: 700;
            color: #ffaa00;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            padding: 4px 14px;
            border-radius: 30px;
            border: 1px solid rgba(255, 170, 0, 0.3);
            box-shadow: 0 0 40px rgba(255, 170, 0, 0.2);
            opacity: 0;
            pointer-events: none;
            white-space: nowrap;
            font-family: 'Inter', sans-serif;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .copy-toast.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        /* ===== НОВА КНОПКА YOUTUBE ===== */
        .btn-yt {
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255, 50, 50, 0.2), 0 0 0 2px #ff0000;
            -webkit-text-stroke: 1px rgba(255, 0, 0, 0.5);
            border-color: rgba(255, 0, 0, 0.3);
        }
        .btn-yt:hover {
            color: #ff9999;
            background: rgba(255, 0, 0, 0.1);
            border-color: #ff0000;
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.2), inset 0 0 40px rgba(255, 0, 0, 0.1);
        }

        @media (max-width: 480px) {
            body { padding: 10px; }
            .card {
                padding: 20px 14px 16px;
                border-radius: 32px;
                min-height: 80vh;
            }
            .fire-text { font-size: 28px; }
            .sub { font-size: 14px; }
            .btn, .btn-email, .btn-yt { padding: 10px 20px; font-size: 14px; min-width: 120px; }
            .avatar-placeholder { height: 30px; }
            .fire-icon { font-size: 20px; }
            .fire-icon:nth-child(2) { font-size: 24px; }
            .fire-icon:nth-child(5) { font-size: 24px; }
            .copy-toast { font-size: 12px; padding: 4px 12px; }
            .btn-group { gap: 6px; }
        }
    </style>
</head>
<body>
    <div class="fire-icons">
        <div class="fire-icon">🔥</div>
        <div class="fire-icon">🔥</div>
        <div class="fire-icon">🔥</div>
        <div class="fire-icon">🔥</div>
        <div class="fire-icon">🔥</div>
        <div class="fire-icon">🔥</div>
        <div class="fire-icon">🔥</div>
        <div class="fire-icon">🔥</div>
        <div class="fire-icon">🔥</div>
        <div class="fire-icon">🔥</div>
        <div class="fire-icon">🔥</div>
        <div class="fire-icon">🔥</div>
    </div>

    <div class="card">
        <div class="avatar-placeholder"></div>
        <div class="fire-text">Gannibal Trading</div>
        <div class="sub">Rock Fan · Record Collector</div>
        <div class="divider">
            <span class="divider-line"></span>
            <span class="divider-icon">✦</span>
            <span class="divider-line"></span>
        </div>

        <div class="btn-group">
            <!-- КНОПКА КАТАЛОГ -->
            <a href="https://docs.google.com/spreadsheets/d/1b8wUNhlKo8arsSiXPvMlN1110AHAv5og/preview" class="btn" target="_blank">View Catalog</a>

            <!-- КНОПКА YOUTUBE -->
            <a href="https://www.youtube.com/@gannibal2009" class="btn btn-yt" target="_blank">YouTube</a>

            <div class="spacer"></div>

            <!-- КНОПКА TELEGRAM -->
            <a href="https://t.me/Gannibal2009" class="btn btn-tg" target="_blank">My Telegram</a>

            <!-- КНОПКА EMAIL -->
            <div class="email-wrapper">
                <button class="btn-email" id="emailBtn">Email</button>
                <span class="copy-toast" id="emailToast">📋 Copied!</span>
            </div>

        </div>
    </div>

    <script>
        document.getElementById('emailBtn').addEventListener('click', function(e) {
            const email = 'rammsteinthebest2015@gmail.com';
            const toast = document.getElementById('emailToast');
            navigator.clipboard.writeText(email).then(() => {
                toast.classList.add('show');
                setTimeout(() => { toast.classList.remove('show'); }, 2000);
            }).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = email;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                toast.classList.add('show');
                setTimeout(() => { toast.classList.remove('show'); }, 2000);
            });
        });
    </script>

</body>
</html>
